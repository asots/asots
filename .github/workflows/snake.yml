name: Generate contribution snake

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "assets/contribution-snake-dark.svg"
      - "assets/contribution-snake-light.svg"

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: asots
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.svg?palette=github-light
      - name: Refresh snake assets on main
        run: |
          mkdir -p assets
          cp dist/github-contribution-grid-snake-dark.svg assets/contribution-snake-dark.svg
          cp dist/github-contribution-grid-snake.svg assets/contribution-snake-light.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-snake-dark.svg assets/contribution-snake-light.svg
          if git diff --cached --quiet; then
            echo "snake unchanged"
          else
            git commit -m "chore: refresh contribution snake"
            git push
          fi
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}