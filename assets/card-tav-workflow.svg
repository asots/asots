  <text x="28" y="44" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2.5">OPEN SOURCE / 02</text>
  <text x="28" y="92" fill="url(#title)" font-family="Inter, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700">tav-workflow</text>
  <text x="28" y="126" fill="#94a3b8" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14">Think → Act → Verify：让 agent 的改动有证据、</text>
